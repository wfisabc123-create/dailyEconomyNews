<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경제 브리핑 | 실시간 뉴스 대시보드</title>
  <style>
    :root{--bg:#f5f6f8;--surface:#fff;--ink:#172033;--muted:#667085;--line:#e6e8ee;--blue:#2563eb;--green:#0f9d72;--red:#dc3c4d;--amber:#c47b16;--shadow:0 8px 28px rgba(25,35,55,.07)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif} button,select{font:inherit} a{color:inherit}
    .shell{max-width:1240px;margin:auto;padding:28px 22px 46px}.top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--blue)}h1{font-size:28px;letter-spacing:-.04em;margin:3px 0 4px}.sub{margin:0;color:var(--muted)}
    .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{color:var(--muted);font-size:13px}.controls select,.refresh{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;color:var(--ink)}.refresh{cursor:pointer;font-weight:650}.refresh:hover{border-color:var(--blue);color:var(--blue)}.stamp{font-size:12px;color:var(--muted);text-align:right;min-height:18px}
    .banner{display:flex;gap:12px;align-items:center;border-left:4px solid var(--blue);padding:12px 14px;background:#eaf1ff;margin-bottom:18px;border-radius:0 10px 10px 0}.banner b{white-space:nowrap}.banner span{color:#34415b}
    .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}.metric,.panel{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px}.metric{padding:15px}.metric-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.metric-value{font-weight:730;font-size:21px;letter-spacing:-.03em;margin-top:6px}.metric-change{font-size:12px;margin-top:3px}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
    .layout{display:grid;grid-template-columns:1.66fr 1fr;gap:18px}.panel{padding:19px}.panel h2{margin:0;font-size:17px;letter-spacing:-.02em}.heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}.source{font-size:12px;color:var(--muted)}
    .news{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.story{display:block;text-decoration:none;padding:15px 0;border-bottom:1px solid var(--line)}.story:hover .story-title{text-decoration:underline;text-decoration-color:var(--blue);text-underline-offset:3px}.story-meta{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:5px}.tag{color:var(--blue);font-weight:700}.story-title{font-weight:680;line-height:1.38;letter-spacing:-.015em}.story-summary{font-size:13px;color:var(--muted);margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .watchlist{margin:6px 0 0;padding:0;list-style:none}.watchlist li{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px}.watch-name{font-weight:650}.watch-symbol{font-size:12px;color:var(--muted)}.watch-price{text-align:right;font-weight:700}.watch-move{text-align:right;font-size:12px}.event{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:56px 1fr;gap:10px}.event time{font-size:12px;color:var(--blue);font-weight:700}.event b{font-size:14px}.event p{margin:2px 0 0;font-size:12px;color:var(--muted)}.empty{padding:22px 0;color:var(--muted);text-align:center}.foot{color:var(--muted);font-size:12px;margin:20px 3px 0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.loading .metric-value,.loading .story-title{opacity:.45}
    @media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}.stamp{text-align:left}}@media(max-width:580px){.shell{padding:20px 14px}.metrics{grid-template-columns:repeat(2,1fr)}.metrics .metric:last-child{grid-column:span 2}.news{grid-template-columns:1fr}.banner{align-items:flex-start;flex-direction:column;gap:3px}h1{font-size:25px}.controls{width:100%}.controls select{flex:1}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">ECONOMIC PULSE · KOREA</div><h1>경제 브리핑</h1><p class="sub">국내외 시장과 경제 핵심 이슈를 한눈에</p></div>
      <div class="controls"><label for="interval">자동 갱신</label><select id="interval" aria-label="자동 갱신 주기"><option value="0">끔</option><option value="60">1분</option><option value="300" selected>5분</option><option value="900">15분</option><option value="1800">30분</option></select><button class="refresh" id="refresh" type="button">지금 갱신</button><span class="stamp" id="stamp" aria-live="polite">데이터 연결 중…</span></div>
    </header>
    <section class="banner" aria-label="오늘의 관전 포인트"><b>오늘의 관전 포인트</b><span id="focus">한국은행 금통위와 주요국 통화정책 신호, 에너지 가격 움직임을 확인하세요.</span></section>
    <section class="metrics loading" id="metrics" aria-label="주요 시장 지표"></section>
    <section class="layout">
      <section>
        <section class="panel"><div class="heading"><h2>주요 경제 뉴스</h2><span class="source">글로벌 경제 뉴스</span></div><div class="news" id="news" aria-live="polite"></div></section>
        <section class="panel" style="margin-top:18px"><div class="heading"><h2>코인 시장 주요 뉴스</h2><span class="source">실시간 · 한국어 번역</span></div><div class="news" id="crypto-news" aria-live="polite"></div></section>
      </section>
      <aside>
        <section class="panel"><div class="heading"><h2>시장 워치리스트</h2><span class="source">장중·지연 시세 혼합</span></div><ul class="watchlist" id="watchlist"></ul></section>
        <section class="panel" style="margin-top:18px"><div class="heading"><h2>이번 주 일정</h2><span class="source">한국 시간</span></div><div id="events"></div></section>
      </aside>
    </section>
    <p class="foot"><span class="dot"></span>공개 데이터 소스를 사용합니다. 가격은 지연될 수 있으며, 투자 판단의 근거로 단독 사용하지 마세요.</p>
  </main>
  <script>
    const fallbackNews=[
      {title:'한국은행 금통위 개최…기준금리 향방에 시장 촉각',domain:'홍콩한타임즈',seendate:'오늘',url:'https://www.hkhantimes.com/news/32532',summary:'주택가격·가계부채와 대외 통화정책을 둘러싼 복합 변수에 시장의 시선이 쏠리고 있습니다.'},
      {title:'유가, 중동 공급 우려 완화 기대에 하락세 연장',domain:'Reuters / Investing.com',seendate:'오늘',url:'https://au.investing.com/news/commodities-news/oil-prices-extend-losses-on-expectations-talks-to-ease-middle-east-supply-woes-4618514',summary:'브렌트유는 공급 차질 완화 기대 속에 약세를 이어갔습니다.'},
      {title:'미국 지표에 달러 강세…연준 금리 전망 재조정',domain:'Livemint',seendate:'오늘',url:'https://www.livemint.com/market/us-data-buoys-dollar-as-fed-hike-expectations-nudged-higher-11787770825665.html',summary:'미국 물가와 금리 기대 변화가 외환시장에 반영되고 있습니다.'},
      {title:'정부, 반도체 호황 세수 활용 미래대응기금 조성 논의',domain:'홍콩한타임즈',seendate:'오늘',url:'https://www.hkhantimes.com/news/32532',summary:'첨단산업 투자와 재정 운용 방안이 주요 경제 정책 이슈로 부상했습니다.'}
    ];
    const assets=[['^KS11','코스피','KOSPI'],['^KQ11','코스닥','KOSDAQ'],['^GSPC','S&P 500','미국'],['^IXIC','나스닥','미국'],['^N225','닛케이 225','일본'],['^HSI','항셍지수','홍콩'],['KRW=X','원/달러','KRW / USD'],['CL=F','WTI 유가','WTI'],['BTC-USD','비트코인','BTC / USD']];
    const events=[['8월 27일 (목)','08:30','경제관계장관회의','물가·민생 관련 부처 일정'],['8월 27일 (목)','10:00','한국은행 금통위','통화정책방향 결정 및 경제전망'],['8월 27일 (목)','21:30','미국 주요 경제지표','고용·물가·성장 관련 발표 여부 확인']];
    let timer=null;
    function escapeHTML(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function timeAgo(v){if(!v)return '방금';const d=new Date(v);const m=Math.max(0,Math.round((Date.now()-d)/60000));return m<60?`${m||1}분 전`:m<1440?`${Math.round(m/60)}시간 전`:`${Math.round(m/1440)}일 전`;}
    function renderNews(items,target='#news'){document.querySelector(target).innerHTML=items.slice(0,8).map((n,i)=>`<a class="story" href="${escapeHTML(n.url)}" target="_blank" rel="noopener"><div class="story-meta"><span class="tag">${i<2?'핵심':'뉴스'}</span><span>${escapeHTML(n.domain||'뉴스')}</span><span>·</span><span>${timeAgo(n.seendate)}</span></div><div class="story-title">${escapeHTML(n.title)}</div>${n.summary?`<p class="story-summary">${escapeHTML(n.summary)}</p>`:''}</a>`).join('');}
    function renderEvents(){document.querySelector('#events').innerHTML=events.map(e=>`<div class="event"><time>${e[0]} · ${e[1]}</time><div><b>${e[2]}</b><p>${e[3]}</p></div></div>`).join('');}
    function fmt(n,symbol){if(!Number.isFinite(n))return '—';if(symbol==='KRW=X')return n.toFixed(2);if(symbol==='BTC-USD')return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});if(symbol==='CL=F')return '$'+n.toFixed(2);return n.toLocaleString('en-US',{maximumFractionDigits:2});}
    function marketCard(a){const [symbol,name,caption]=a;return `<article class="metric" id="m-${symbol.replace(/[^a-z0-9]/gi,'')}"><div class="metric-label"><span>${name}</span><span>${caption}</span></div><div class="metric-value">—</div><div class="metric-change flat">불러오는 중</div></article>`}
    function renderMarketShell(){const el=document.querySelector('#metrics');el.innerHTML=assets.map(marketCard).join('');document.querySelector('#watchlist').innerHTML=assets.map(a=>`<li id="w-${a[0].replace(/[^a-z0-9]/gi,'')}"><div><div class="watch-name">${a[1]}</div><div class="watch-symbol">${a[2]}</div></div><div><div class="watch-price">—</div><div class="watch-move flat">불러오는 중</div></div></li>`).join('');}
    function updateQuote(a,quote){const [symbol,name]=a,key=symbol.replace(/[^a-z0-9]/gi,'');const p=quote.regularMarketPrice,prev=quote.regularMarketPreviousClose;const pct=Number.isFinite(p)&&Number.isFinite(prev)&&prev?((p-prev)/prev*100):null;const cls=pct===null?'flat':pct>0?'up':pct<0?'down':'flat';const quoteDate=quote.regularMarketTime?new Date(quote.regularMarketTime*1000):null;const today=new Date();const isToday=quoteDate&&quoteDate.toLocaleDateString('ko-KR')===today.toLocaleDateString('ko-KR');const state=quote.marketState|| (isToday?new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit'}).format(quoteDate):'전일 마감');const label=pct===null?'—':`${pct>0?'+':''}${pct.toFixed(2)}% · ${state}`;for(const root of [document.querySelector('#m-'+key),document.querySelector('#w-'+key)])if(root){const value=root.querySelector(root.classList.contains('metric')?'.metric-value':'.watch-price'),change=root.querySelector(root.classList.contains('metric')?'.metric-change':'.watch-move');value.textContent=fmt(p,symbol);change.textContent=label;change.className=change.className.replace(/\b(up|down|flat)\b/g,'')+' '+cls;}}
    async function getMarkets(){try{const r=await fetch('/api/markets',{cache:'no-store'});if(!r.ok)throw Error(r.status);const quotes=await r.json();assets.forEach(a=>quotes[a[0]]&&updateQuote(a,quotes[a[0]]));}catch(e){console.warn('market unavailable',e);}document.querySelector('#metrics').classList.remove('loading');}
    async function getNews(){try{const r=await fetch('/api/news',{cache:'no-store'});if(!r.ok)throw Error(r.status);const articles=await r.json();if(!Array.isArray(articles)||articles.length<3)throw Error('few articles');renderNews(articles);}catch(e){renderNews(fallbackNews);}}
    async function getCryptoNews(){try{const r=await fetch('/api/crypto-news',{cache:'no-store'});if(!r.ok)throw Error(r.status);const articles=await r.json();if(!Array.isArray(articles)||articles.length<2)throw Error('few articles');renderNews(articles,'#crypto-news');}catch(e){document.querySelector('#crypto-news').innerHTML='<p class="empty">코인 뉴스 연결을 다시 시도하고 있습니다.</p>';}}
    async function refresh(){const b=document.querySelector('#refresh');b.disabled=true;b.textContent='갱신 중…';await Promise.all([getMarkets(),getNews(),getCryptoNews()]);document.querySelector('#stamp').textContent=`마지막 갱신 ${new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}`;b.disabled=false;b.textContent='지금 갱신';}
    function schedule(){clearInterval(timer);const seconds=Number(document.querySelector('#interval').value);if(seconds)timer=setInterval(refresh,seconds*1000);}
    document.querySelector('#refresh').addEventListener('click',refresh);document.querySelector('#interval').addEventListener('change',schedule);renderMarketShell();renderEvents();renderNews(fallbackNews);document.querySelector('#crypto-news').innerHTML='<p class="empty">코인 뉴스 연결 중…</p>';if(location.protocol==='file:'){document.querySelector('#stamp').textContent='실시간 데이터는 start-dashboard.cmd로 실행하세요';document.querySelector('#refresh').disabled=true;document.querySelector('#focus').textContent='뉴스와 시세를 안전하게 불러오려면 start-dashboard.cmd를 실행하세요. 파일 직접 열기에서는 기사 미리보기만 표시됩니다.';}else{refresh();schedule();}
  </script>
</body>
</html>
